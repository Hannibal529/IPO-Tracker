name: IPO 데이터 수집·배포

on:
  schedule:
    - cron: "17 23 * * 0-4"   # 평일 08:17 KST
    - cron: "47 8 * * 1-5"    # 평일 17:47 KST (장 마감·공시 반영)
  workflow_dispatch:           # Actions 탭에서 수동 실행
  push:
    paths: ["site/**", "data/manual.json", "collector/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: ipo, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m collector.build
      - name: 상태 저장
        run: |
          git config user.name "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git add data/state.json site/data/ipo.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)" && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
