name: IPO 데이터 수집·배포

on:
  schedule:
    - cron: "17 23 * * 0-4"   # 평일 08:17 KST
    - cron: "47 8 * * 1-5"    # 평일 17:47 KST (장 마감·공시 반영)
  workflow_dispatch:           # Actions 탭에서 수동 실행
    inputs:
      dump:
        description: "파서 점검용 원문 표 추출 (종목명, 쉼표 구분). 비우면 일반 수집"
        required: false
        default: ""
      debug_naver:
        description: "네이버 실적표 점검용 종목코드 (비우면 생략)"
        required: false
        default: ""
  push:
    paths: ["site/**", "data/manual.json", "collector/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: ipo, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4      # DART 고유번호·원문 캐시 (매 실행 재다운로드 방지)
        with:
          path: data/cache
          key: dart-${{ github.run_id }}
          restore-keys: dart-
      - name: 네이버 점검
        if: ${{ github.event.inputs.debug_naver != '' && github.event.inputs.debug_naver != null }}
        run: python -m collector.debug_naver ${{ github.event.inputs.debug_naver }}
      - name: 원문 표 추출(점검용)
        if: ${{ github.event.inputs.dump != '' && github.event.inputs.dump != null }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DUMP_NAMES: ${{ github.event.inputs.dump }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m collector.dump
          git config user.name "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git checkout -b debug-docs
          git add -f debug && git commit -qm "debug dump" && git push -f origin debug-docs
      - name: 수집
        if: ${{ github.event.inputs.dump == '' || github.event.inputs.dump == null }}
        continue-on-error: true   # 수집이 실패해도 기존 데이터로 사이트는 배포
        timeout-minutes: 22
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m collector.build
      - name: 산출 근거 PDF
        if: ${{ github.event.inputs.dump == '' || github.event.inputs.dump == null }}
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq fonts-nanum >/dev/null
          python -m collector.report
      - name: 상태 저장
        if: ${{ github.event.inputs.dump == '' || github.event.inputs.dump == null }}
        run: |
          git config user.name "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git add data/state.json data/fincache.json site/data/ipo.json
          git diff --cached --quiet && exit 0
          git commit -qm "data: $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
