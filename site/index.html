<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IPO 트래커</title>
<style>
:root{--bg:#f6f6f4;--surface:#fcfcfb;--line:#e4e3de;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a8984;
--accent:#2a78d6;--accent-soft:#e8f1fc;--up:#c8341f;--down:#1f6fc8;--warn:#9a6a00;--warn-bg:#fff6dc;
--ev-fc:#2a78d6;--ev-sub:#d4671a;--ev-list:#1b8a5a;--ev-pay:#7a5bc7;--ev-lock:#8a8984}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--surface:#1a1a19;--line:#2e2e2c;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8f8e87;
--accent:#3987e5;--accent-soft:#1d2a3b;--warn:#f2c14e;--warn-bg:#2d2614;--ev-fc:#3987e5;--ev-sub:#e5853f;--ev-list:#3aa775;--ev-pay:#9b80e0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;align-items:baseline;gap:16px;padding:20px 28px 0;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:-.3px}
.meta{color:var(--ink3);font-size:12px}
nav{display:flex;gap:4px;padding:14px 28px 0;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:10px 14px;font:inherit;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
main{padding:20px 28px 60px}
.warns{margin:12px 28px 0;padding:8px 12px;background:var(--warn-bg);color:var(--warn);border-radius:6px;font-size:12px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar label{color:var(--ink2);font-size:13px;display:flex;gap:4px;align-items:center}
.bar input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;width:200px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--ink2);font-size:12px;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
th:first-child,td:first-child,.l{text-align:left}
tbody tr:hover{background:var(--accent-soft)}
tbody tr.click{cursor:pointer}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink2);margin-left:4px}
.st{font-size:12px;color:var(--ink2)}
.pos{color:var(--up)}.neg{color:var(--down)}.mute{color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chart{padding:14px 16px}
.chart h3{margin:0 0 2px;font-size:14px}.chart p{margin:0 0 8px;color:var(--ink3);font-size:12px}
svg text{fill:var(--ink2);font-size:11px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 8px;border-radius:6px;font-size:12px;display:none;z-index:9}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);background:var(--surface)}
.cal div.h{padding:6px;font-size:12px;color:var(--ink2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cal .d{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}
.cal .d.o{background:var(--bg);color:var(--ink3)}
.cal .d.t .n{background:var(--ink);color:var(--surface);border-radius:10px;padding:0 6px}
.cal .n{font-size:11px;color:var(--ink2);margin-bottom:2px;display:inline-block}
.ev{display:block;font-size:11px;padding:1px 4px;margin:2px 0;border-radius:3px;border-left:3px solid;background:var(--bg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
/* drawer */
.drawer{position:fixed;top:0;right:0;width:min(720px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .2s;overflow:auto;z-index:5;padding:22px 26px}
.drawer.on{transform:none}
.drawer h2{margin:0 0 4px;font-size:20px}
.drawer h4{margin:22px 0 8px;font-size:13px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{background:var(--bg);border-radius:6px;padding:8px 10px}
.kv b{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.x{position:absolute;right:18px;top:16px;border:0;background:none;font-size:22px;color:var(--ink2);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer;font:inherit}
a{color:var(--accent)}
.note{font-size:12px;color:var(--ink2);background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:8px}
</style>
</head>
<body>
<header><h1>IPO 트래커</h1><span class="meta" id="upd"></span></header>
<div id="warns"></div>
<nav id="tabs"></nav>
<main id="main"></main>
<aside class="drawer" id="drawer"></aside>
<div class="tip" id="tip"></div>
<script>
const TABS=[["pipe","공모 예정"],["cal","IPO 캘린더"],["dem","수요예측 추이"],["lock","보호예수 해제"]];
let D,tab="pipe",calM=null;
const $=s=>document.querySelector(s);
const today=new Date().toISOString().slice(0,10);
const fmt=(v,d=0)=>v==null||v===""||isNaN(v)?"–":Number(v).toLocaleString("ko-KR",{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=(v,d=1)=>v==null||isNaN(v)?"–":(v*100).toFixed(d)+"%";
const md=s=>s?s.slice(5).replace("-","/"):"–";
const rng=a=>a&&a.length?(a[0]===a[1]?md(a[0]):md(a[0])+"~"+md(a[1]).replace(/^0?(\d+)\//,(m,x)=>a[0].slice(5,7)===a[1].slice(5,7)?"":m)):"–";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const m=String(s??"").replace(/,/g,"").match(/[\d.]+/);return m?+m[0]:null};

function status(p){
  if(p.listing&&p.listing<=today)return["상장완료",5];
  if(p.payment&&p.payment<=today)return["상장대기",4];
  if(p.subscription&&p.subscription[0]<=today)return p.subscription[1]>=today?["청약중",3]:["상장대기",4];
  if(p.forecast&&p.forecast[0]<=today)return p.forecast[1]>=today?["수요예측중",2]:["청약대기",2.5];
  return["신고서 제출",1];
}

async function load(){
  D=window.__DATA__||await (await fetch("data/ipo.json",{cache:"no-store"})).json();
  $("#upd").textContent="업데이트 "+(D.updated_at||"–")+" · 출처 DART OpenAPI, 38커뮤니케이션";
  if(D.warnings&&D.warnings.length)$("#warns").innerHTML=`<div class="warns">수집 경고 ${D.warnings.length}건 — ${D.warnings.map(esc).join(" / ")}</div>`;
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join("");
  $("#tabs").onclick=e=>{if(e.target.dataset.k){tab=e.target.dataset.k;render()}};
  const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h;
  render();
}
function render(){
  location.hash=tab;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===tab));
  ({pipe:rPipe,cal:rCal,dem:rDem,lock:rLock})[tab]();
}

/* ---------- 공모 예정 ---------- */
let pf={q:"",all:false,spac:false},psort=["sched",1];
function rPipe(){
  let rows=D.pipeline.map(p=>{const v=p.our_valuation||{};const [st,so]=status(p);
    return{...p,st,so,sched:(p.forecast||p.subscription||[p.first_filed||""])[0]||"9",val:v.value,
      up:v.value&&p.band?v.value/p.band[1]-1:null,comp:num(p.competition)}});
  rows=rows.filter(p=>(pf.all||p.so<5||(p.listing&&p.listing>=addD(today,-14)))&&(pf.spac||!/스팩/.test(p.name))&&(!pf.q||p.name.includes(pf.q)||(p.underwriter||"").includes(pf.q)));
  const [k,dir]=psort;rows.sort((a,b)=>(a[k]??"")>(b[k]??"")?dir:(a[k]??"")<(b[k]??"")?-dir:0);
  const cols=[["name","종목"],["st","상태"],["underwriter","주관사"],["sched","수요예측"],["subscription","청약"],["listing","상장"],["band","희망밴드"],["final_price","확정가"],["ua_multiple","주관사 지표"],["ua_value","주관사 평가가액"],["discount","할인율"],["val","재산정 적정가"],["up","밴드상단 대비"],["comp","기관경쟁률"],["lock_ratio_38","확약비율"]];
  $("#main").innerHTML=`<div class="bar"><input type="search" id="q" placeholder="종목·주관사 검색" value="${esc(pf.q)}">
  <label><input type="checkbox" id="all" ${pf.all?"checked":""}>상장 완료 포함</label>
  <label><input type="checkbox" id="spac" ${pf.spac?"checked":""}>스팩 표시</label>
  <span class="meta">${rows.length}종목 · 행을 누르면 상세</span></div>
  <div class="card"><table><thead><tr>${cols.map(([c,l])=>`<th data-c="${c}">${l}${psort[0]===c?(psort[1]>0?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>
  ${rows.map(p=>`<tr class="click" data-n="${esc(p.name)}">
   <td><b>${esc(p.name)}</b>${p.market?`<span class="tag">${esc(p.market)}</span>`:""}${p.special?'<span class="tag">특례</span>':""}</td>
   <td class="st">${p.st}</td><td class="l">${esc(p.underwriter||"–")}</td>
   <td>${rng(p.forecast)}</td><td>${rng(p.subscription)}</td><td>${md(p.listing)}</td>
   <td>${p.band?fmt(p.band[0])+"~"+fmt(p.band[1]):"–"}</td><td>${fmt(p.final_price)}</td>
   <td>${p.ua_multiple?esc(p.ua_method)+" "+fmt(p.ua_multiple,2):"–"}</td><td>${fmt(p.ua_value)}</td>
   <td>${esc(p.discount||"–")}</td><td><b>${p.our_valuation&&p.our_valuation.value_range?fmt(p.our_valuation.value_range[0])+"~"+fmt(p.our_valuation.value_range[1]):fmt(p.val)}</b></td>
   <td class="${p.up>0?"pos":p.up<0?"neg":""}">${p.up==null?"–":(p.up>0?"+":"")+pct(p.up)}</td>
   <td>${p.comp?fmt(p.comp,1)+":1":"–"}</td><td>${pct(p.lock_ratio_38)}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="meta">재산정 적정가: 비교기업 시가총액은 최근 61영업일 종가 평균, 이익은 LTM 지배주주순이익으로 멀티플을 다시 계산(적자·이상치 제외 후 평균)하고, 주관사 기준이익에 적용. 바이오 추정이익은 할인율 20%·25%로 현가를 다시 계산해 범위로 표시. 밴드상단 대비 = 적정가(중간값) ÷ 밴드 상단 − 1.</p>`;
  $("#q").oninput=e=>{pf.q=e.target.value;rPipe();$("#q").focus();$("#q").setSelectionRange(99,99)};
  $("#all").onchange=e=>{pf.all=e.target.checked;rPipe()};$("#spac").onchange=e=>{pf.spac=e.target.checked;rPipe()};
  document.querySelectorAll("th[data-c]").forEach(th=>th.onclick=()=>{const c=th.dataset.c;psort=[c,psort[0]===c?-psort[1]:1];rPipe()});
  document.querySelectorAll("tr[data-n]").forEach(tr=>tr.onclick=()=>detail(tr.dataset.n));
}
function addD(s,n){const d=new Date(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}

function detail(name){
  const p=D.pipeline.find(x=>x.name===name);if(!p)return;const v=p.our_valuation;
  const dm=(D.demand||[]).find(x=>x.name===name)||{};
  $("#drawer").innerHTML=`<button class="x" onclick="$('#drawer').classList.remove('on')">×</button>
  <h2>${esc(p.name)}</h2><div class="meta">${esc(p.market||"")} ${p.special?"· 특례상장":""} · ${esc(p.underwriter||"")} ${p.rcept_no?`· <a href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${p.rcept_no}" target="_blank">DART 원문</a>`:""}</div>
  ${p.business?`<p>${esc(p.business)}</p>`:""}
  <h4>일정</h4><div class="kv">
   <div><b>신고서 최초 제출</b>${p.first_filed||"–"}</div><div><b>최종 정정</b>${p.last_amended||"–"}</div><div><b>수요예측</b>${rng(p.forecast)}</div>
   <div><b>청약</b>${rng(p.subscription)}</div><div><b>납입</b>${md(p.payment)}</div><div><b>상장</b>${md(p.listing)}</div></div>
  <h4>공모 구조</h4><div class="kv">
   <div><b>희망밴드</b>${p.band?fmt(p.band[0])+" ~ "+fmt(p.band[1])+"원":"–"}</div><div><b>확정공모가</b>${fmt(p.final_price)}원</div><div><b>공모주식수</b>${fmt(p.shares_offered)}주</div>
   <div><b>공모금액</b>${esc(p.amount||"–")}</div><div><b>예상 시가총액</b>${esc(p.exp_mcap||"–")}</div><div><b>기관경쟁률 / 확약</b>${esc(p.competition||"–")} / ${pct(p.lock_ratio_38)}</div></div>
  <h4>주관사 밸류에이션</h4><div class="kv">
   <div><b>적용 지표</b>${esc(p.ua_method||"–")} ${p.ua_multiple?fmt(p.ua_multiple,2)+"배":""}</div><div><b>주당 평가가액</b>${fmt(p.ua_value)}원</div><div><b>공모가 할인율</b>${esc(p.discount||"–")}</div>
   <div><b>적용 이익(①)</b>${p.ua_base?fmt(p.ua_base/1e8)+"억원":"–"}</div><div><b>적용 주식수</b>${fmt(p.ua_shares)}주</div><div><b>추정이익 현가 할인율</b>${p.ua_est?(p.ua_est.rate*100).toFixed(0)+"% (주관사)":"실적 기준"}${p.bio?' <span class="tag">바이오</span>':""}</div></div>
  <h4>재산정 (최근 주가 기준)</h4>
  ${v&&v.peers?`<div class="kv"><div><b>적용 지표</b>${esc(v.method)} 평균 ${fmt(v.multiple_mean,2)}배 <span class="mute">(중앙값 ${fmt(v.multiple_median,2)})</span></div><div><b>재산정 주당가치</b><span style="font-size:16px;font-weight:600">${v.value_range?fmt(v.value_range[0])+" ~ "+fmt(v.value_range[1]):fmt(v.value)}원</span>${v.values&&Object.keys(v.values).length>1?`<br><span class="meta">${Object.entries(v.values).map(([k,x])=>esc(k)+" "+fmt(x)+"원").join(" / ")}</span>`:""}</div>
   <div><b>밴드 할인율(상단~하단)</b>${v.band_discount?pct(v.band_discount[0])+" ~ "+pct(v.band_discount[1]):"–"}</div></div>
   <div class="card" style="margin-top:10px"><table><thead><tr><th>기업</th><th>구분</th><th>61일 평균가</th><th>시총(억)</th><th>LTM 기준</th><th>주관사 ${esc(v.method)}</th><th>재산정 ${esc(v.method)}</th><th class="l">판단</th></tr></thead><tbody>
   ${v.peers.map(q=>`<tr><td>${esc(q.name)}</td><td>${esc(q.origin)}</td><td>${fmt(q.avg61)}</td><td>${fmt(q.mcap_eok)}</td><td class="mute">${esc(q.fin_basis||"–")}</td><td>${fmt(q.ua_multiple,2)}</td><td>${fmt((q.multiples||{})[v.method],2)}</td><td class="l ${q.kept?"":"mute"}">${q.kept?"✓ ":"✕ "}${esc(q.reason)}</td></tr>`).join("")}
   </tbody></table></div><div class="note">${esc(v.rationale||"")}${v.note?"<br>"+esc(v.note):""}${v.price_basis?"<br>"+esc(v.price_basis):""}<br>기준일 ${esc(v.as_of)}</div>`
   :(p.peers_ua&&p.peers_ua.length?`<div class="card"><table><thead><tr><th>주관사 비교기업</th><th>주관사 ${esc(p.ua_method||"")}</th></tr></thead><tbody>${p.peers_ua.map(q=>`<tr><td>${esc(q.name)}</td><td>${fmt(q.ua_multiple,2)}</td></tr>`).join("")}</tbody></table></div><div class="note">재산정은 다음 수집 때 계산됩니다.</div>`:`<div class="note">신고서에서 비교기업 표를 찾지 못했습니다.</div>`)}
  ${dm.inst_count?`<h4>수요예측 참여</h4><div class="kv"><div><b>참여 건수</b>${fmt(dm.inst_count)}</div><div><b>운용사 참여비율</b>${pct(dm.am_part_ratio)}</div><div><b>운용사 확약비율</b>${pct(dm.am_lock_ratio)}</div></div>`:""}`;
  $("#drawer").classList.add("on");
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#drawer").classList.remove("on")});

/* ---------- 캘린더 ---------- */
const EV={fc:["수요예측","var(--ev-fc)"],sub:["청약","var(--ev-sub)"],pay:["납입","var(--ev-pay)"],list:["상장","var(--ev-list)"],lock:["확약해제","var(--ev-lock)"]};
function events(){
  const ev=[];const span=(a,t,n)=>{if(!a)return;let d=a[0];while(d<=a[1]){const w=new Date(d).getDay();if(w&&w<6)ev.push({d,t,n});d=addD(d,1)}};
  D.pipeline.forEach(p=>{span(p.forecast,"fc",p.name);span(p.subscription,"sub",p.name);if(p.payment)ev.push({d:p.payment,t:"pay",n:p.name});if(p.listing)ev.push({d:p.listing,t:"list",n:p.name})});
  (D.lockups||[]).forEach(l=>(l.releases||[]).forEach(r=>r.date&&ev.push({d:r.date,t:"lock",n:`${l.name} ${r.period} ${pct(r.ratio)}`})));
  return ev;
}
function rCal(){
  if(!calM)calM=today.slice(0,7);
  const [y,m]=calM.split("-").map(Number),first=new Date(y,m-1,1),start=new Date(first);start.setDate(1-first.getDay());
  const ev=events(),by={};ev.forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
  let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if(i>=35&&d.getMonth()!==m-1)break;
    cells+=`<div class="d ${d.getMonth()!==m-1?"o":""} ${s===today?"t":""}"><span class="n">${d.getDate()}</span>${(by[s]||[]).sort((a,b)=>"fc sub pay list lock".indexOf(a.t)-"fc sub pay list lock".indexOf(b.t)).map(e=>`<span class="ev" style="border-color:${EV[e.t][1]}" title="${EV[e.t][0]} · ${esc(e.n)}" data-n="${esc(e.n)}">${EV[e.t][0]} ${esc(e.n)}</span>`).join("")}</div>`}
  $("#main").innerHTML=`<div class="bar"><button class="btn" id="pv">‹</button><b style="font-size:16px">${y}년 ${m}월</b><button class="btn" id="nx">›</button><button class="btn" id="td">오늘</button>
  <div class="legend">${Object.values(EV).map(([l,c])=>`<span style="--c:${c}">${l}</span>`).join("")}</div></div>
  <div class="cal">${"일월화수목금토".split("").map(w=>`<div class="h">${w}</div>`).join("")}${cells}</div>`;
  const mv=n=>{const d=new Date(y,m-1+n,1);calM=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;rCal()};
  $("#pv").onclick=()=>mv(-1);$("#nx").onclick=()=>mv(1);$("#td").onclick=()=>{calM=null;rCal()};
  document.querySelectorAll(".ev").forEach(e=>e.onclick=()=>{const n=e.dataset.n;if(D.pipeline.some(p=>p.name===n))detail(n)});
}

/* ---------- 수요예측 추이 ---------- */
let dsort=["listing",-1];
function q(s){if(!s)return null;const y=s.slice(2,4),m=+s.slice(5,7);return `${y}.${Math.ceil(m/3)}Q`}
function barChart(id,data,fmtV,unit){
  const W=560,H=220,P={l:44,r:8,t:10,b:28},mx=Math.max(...data.map(d=>d.v))*1.1||1,bw=(W-P.l-P.r)/data.length;
  const yt=[0,.25,.5,.75,1].map(f=>f*mx);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  yt.forEach(v=>{const yy=P.t+(H-P.t-P.b)*(1-v/mx);s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${yy+4}" text-anchor="end">${fmtV(v)}</text>`});
  data.forEach((d,i)=>{const h=(H-P.t-P.b)*d.v/mx,x=P.l+i*bw+bw*.18,w=bw*.64,y=H-P.b-h;
    s+=`<path d="M${x},${H-P.b}V${y+Math.min(4,h)}q0,-4 4,-4h${w-8}q4,0 4,4V${H-P.b}Z" fill="var(--accent)"/>`+
       `<rect x="${P.l+i*bw}" y="${P.t}" width="${bw}" height="${H-P.t-P.b}" fill="transparent" data-tip="${d.k}: ${fmtV(d.v)}${unit} (${d.n}건)"/>`+
       `<text x="${x+w/2}" y="${H-P.b+16}" text-anchor="middle">${d.k}</text>`});
  return s+`<line x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}" stroke="var(--ink3)"/></svg>`;
}
function rDem(){
  const rows=(D.demand||[]).filter(r=>r.name).map(r=>({...r,q:q(r.listing),lockR:r.am_lock_ratio??r.lock_ratio_38}));
  const g={};rows.forEach(r=>{if(!r.q)return;(g[r.q]=g[r.q]||[]).push(r)});
  const ks=Object.keys(g).sort();
  const avg=(a,f)=>{const v=a.map(f).filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
  const c1=ks.map(k=>({k,v:avg(g[k],r=>r.inst_competition)||0,n:g[k].filter(r=>r.inst_competition).length}));
  const c2=ks.map(k=>({k,v:avg(g[k],r=>r.lockR)||0,n:g[k].filter(r=>r.lockR!=null).length}));
  const [k,dir]=dsort;const sorted=[...rows].sort((a,b)=>(a[k]??"")>(b[k]??"")?dir:(a[k]??"")<(b[k]??"")?-dir:0);
  const cols=[["name","종목"],["listing","상장일"],["inst_competition","기관경쟁률"],["amount_eok","공모금액(억)"],["inst_count","참여 건수"],["am_count","운용사 건수"],["am_part_ratio","운용사 참여비율"],["am_lock_ratio","운용사 확약비율"],["lock_ratio_38","전체 확약(38)"]];
  $("#main").innerHTML=`<div class="grid2">
   <div class="card chart"><h3>분기별 평균 기관 경쟁률</h3><p>상장일 기준 분기 · 막대에 마우스를 올리면 값</p>${barChart("c1",c1,v=>fmt(v),":1")}</div>
   <div class="card chart"><h3>분기별 평균 운용사 확약 비율</h3><p>운용사(집합) 확약수량 ÷ 참여수량, 없으면 38 전체 확약비율</p>${barChart("c2",c2,v=>(v*100).toFixed(0)+"%","")}</div></div>
  <div class="card"><table><thead><tr>${cols.map(([c,l])=>`<th data-c="${c}">${l}${dsort[0]===c?(dsort[1]>0?" ↑":" ↓"):""}</th>`).join("")}</tr></thead><tbody>
  ${sorted.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.listing||"–"}</td><td>${fmt(r.inst_competition,1)}</td><td>${fmt(r.amount_eok)}</td><td>${fmt(r.inst_count)}</td><td>${fmt(r.am_count)}</td><td>${pct(r.am_part_ratio)}</td><td>${pct(r.am_lock_ratio)}</td><td>${pct(r.lock_ratio_38)}</td></tr>`).join("")}</tbody></table></div>`;
  document.querySelectorAll("th[data-c]").forEach(th=>th.onclick=()=>{const c=th.dataset.c;dsort=[c,dsort[0]===c?-dsort[1]:-1];rDem()});
  tips();
}
function tips(){const t=$("#tip");document.querySelectorAll("[data-tip]").forEach(el=>{
  el.onmousemove=e=>{t.style.display="block";t.textContent=el.dataset.tip;t.style.left=e.clientX+12+"px";t.style.top=e.clientY-30+"px";el.previousElementSibling.style.opacity=.75};
  el.onmouseleave=()=>{t.style.display="none";el.previousElementSibling.style.opacity=1}})}

/* ---------- 보호예수 ---------- */
let lf={past:false};
function rLock(){
  const all=[];(D.lockups||[]).forEach(l=>(l.releases||[]).forEach(r=>all.push({...r,name:l.name,listing:l.listing,total:l.total_shares})));
  const from=addD(today,-7),soon=addD(today,14);
  const rows=all.filter(r=>r.date&&(lf.past||r.date>=from)).sort((a,b)=>a.date<b.date?-1:1);
  $("#main").innerHTML=`<div class="bar"><label><input type="checkbox" id="past" ${lf.past?"checked":""}>지난 해제 포함</label><span class="meta">최근 7일 ~ 이후 · 2주 내 해제는 굵게</span></div>
  <div class="card"><table><thead><tr><th>해제일</th><th class="l">종목</th><th>상장일</th><th>구분</th><th>해제 물량(주)</th><th>상장주식 대비</th><th>D-day</th></tr></thead><tbody>
  ${rows.map(r=>{const dd=Math.round((new Date(r.date)-new Date(today))/864e5);return`<tr style="${r.date>=today&&r.date<=soon?"font-weight:600":""}" class="${r.date<today?"mute":""}">
   <td class="l">${r.date}</td><td class="l">${esc(r.name)}</td><td>${r.listing||"–"}</td><td>${r.period} 확약</td><td>${fmt(r.shares)}</td><td>${pct(r.ratio,2)}</td><td>${dd===0?"D-day":dd>0?"D-"+dd:"D+"+(-dd)}</td></tr>`}).join("")||'<tr><td colspan="7" class="l mute">표시할 해제 일정이 없습니다</td></tr>'}
  </tbody></table></div>`;
  $("#past").onchange=e=>{lf.past=e.target.checked;rLock()};
}
load();
</script>
